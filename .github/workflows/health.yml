name: Index backup cleanup

# يومياً: يحذف النسخ الاحتياطية المؤقتة للفهرس (Kage وKage Novels). فحص المصادر انتقل إلى ShaDo-sources.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Delete expired index backups (24h)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/cleanup.js

